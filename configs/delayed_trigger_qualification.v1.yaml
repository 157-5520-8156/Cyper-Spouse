  - mechanism_id: expression.reconsideration
    purpose: Reconsider remaining frozen Beats after user interjection
    release_status: active
    trigger_mode: event_triggered
    upstream_authority: [new Observation while accepted Beats remain]
    due_identity: {coordinates: [world_id, actor_ref, plan_id, interruption_observation_ref, epoch], logical_deadline: interjecting Observation commit, merge_dedup_key: plan_interruption_epoch}
