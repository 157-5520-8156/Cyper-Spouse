  - mechanism_id: conversation.commitment_due
    purpose: Dispatch or break a deferred-reply private commitment at its due window
    release_status: active
    upstream_authority: [accepted PrivateCommitment with due_window]
    due_identity: {coordinates: [world_id, actor_ref, commitment_id, revision], logical_deadline: CommitmentValues.due_window, merge_dedup_key: commitment_revision}
