    observability: [health, causal lineage, authority revision, expiry latency, ledger refs]
    fault_matrix: [CAS conflict, restart, lease expiry, late result, withdrawal/permission change, same-deadline concurrency, bad-trigger starvation]
    vertical_lanes: [clock]
