mechanisms:
  - mechanism_id: proactive.event_driven
    purpose: Event-driven proactive-contact consideration
    release_status: active
    upstream_authority: [accepted-character-visible-context-stimulus]
    due_identity: {coordinates: [world_id, actor_ref, source_set, epoch, retry_ordinal], logical_deadline: next_consideration_at, merge_dedup_key: proactive_context_window}
    controlled_injection: {public_seams: [QQC2CHost.inbound_text, QQC2CHost.inbound_fragment, QQC2CHost.tick, QQC2CHost.drain], upstream_material: [real accepted stimulus, logical Clock advance]}
    expected_path: [scheduler discovery, TriggerProcess claim/CAS, CharacterInterior decision, typed proposal, Action/receipt]
    legal_terminals: [now accepted, later scheduled, role silent, superseded, technical failure/retry]
    visible_effect: qq
    observability: [health, causal lineage, ModelResult, usage/cost, latency, ledger refs]
    fault_matrix: [provider timeout/invalid, CAS conflict, restart, lease expiry, late result, withdrawal/permission change, bad-trigger starvation]
    vertical_lanes: [proactive_action]
    closure_mechanisms: [expression-beats-deferred-replies]
    projection_due_fields: [ProactiveOpportunity.scheduled_for]
    action_kinds: [proactive_message]
    model_contract: {purpose: proactive_contact, contract_identity: character-interior-proactive-contact-decision.1}
    retry_policy: {policy_id: technical-retry-10-30-120.1, seconds: [600, 1800, 7200]}
    activation_note: Active event opportunity; the scheduler never decides whether the character speaks.

  - mechanism_id: proactive.ambient
    purpose: Sparse ambient proactive-contact consideration
    release_status: active
    upstream_authority: [persisted ClockAdvanced opportunity]
    due_identity: {coordinates: [world_id, actor_ref, epoch, retry_ordinal], logical_deadline: next_consideration_at, merge_dedup_key: proactive_ambient_epoch}
    controlled_injection: {public_seams: [QQC2CHost.tick, QQC2CHost.drain], upstream_material: [accepted user Observation, logical Clock advance]}
    expected_path: [scheduler discovery, TriggerProcess claim/CAS, CharacterInterior decision, typed proposal, Action/receipt]
    legal_terminals: [now accepted, later scheduled, role silent, superseded, technical failure/retry]
    visible_effect: qq
    observability: [health, causal lineage, ModelResult, usage/cost, latency, ledger refs]
    fault_matrix: [provider timeout/invalid, CAS conflict, restart, lease expiry, late result, withdrawal/permission change, bad-trigger starvation]
    vertical_lanes: [proactive_action]
    closure_mechanisms: [expression-beats-deferred-replies]
    projection_due_fields: [ProactiveOpportunity.scheduled_for]
    action_kinds: [proactive_message]
    model_contract: {purpose: proactive_contact, contract_identity: character-interior-proactive-contact-decision.1}
    retry_policy: {policy_id: technical-retry-10-30-120.1, seconds: [600, 1800, 7200]}
    activation_note: Active sparse fallback opportunity; an accepted Observation establishes the actor context, while Clock only opens the consideration and supplies neither motive nor wording.

  - mechanism_id: proactive.post_silent
    purpose: Reconsideration after one role-authored proactive silence
    release_status: active
    upstream_authority: [accepted proactive silent decision]
    due_identity: {coordinates: [world_id, actor_ref, source_set, epoch, retry_ordinal], logical_deadline: next_consideration_at, merge_dedup_key: proactive_post_silent_epoch}
    controlled_injection: {public_seams: [QQC2CHost.tick, QQC2CHost.drain], upstream_material: [accepted role-silent terminal, logical Clock advance]}
    expected_path: [scheduler discovery, TriggerProcess claim/CAS, CharacterInterior decision, typed proposal, Action/receipt]
    legal_terminals: [now accepted, later scheduled, role silent, superseded, technical failure/retry]
    visible_effect: qq
    observability: [health, causal lineage, ModelResult, usage/cost, latency, ledger refs]
    fault_matrix: [provider timeout/invalid, CAS conflict, restart, lease expiry, late result, withdrawal/permission change, bad-trigger starvation]
    vertical_lanes: [proactive_action]
    closure_mechanisms: [expression-beats-deferred-replies]
    projection_due_fields: [ProactiveOpportunity.scheduled_for]
    action_kinds: [proactive_message]
    model_contract: {purpose: proactive_contact, contract_identity: character-interior-proactive-contact-decision.1}
    retry_policy: {policy_id: technical-retry-10-30-120.1, seconds: [600, 1800, 7200]}
    activation_note: A prior silence closes only its own consideration and cannot consume future context.

  - mechanism_id: proactive.technical_retry
    purpose: Durable retry after proactive character-author technical failure
    release_status: active
    upstream_authority: [technical ModelResult terminal]
    due_identity: {coordinates: [world_id, actor_ref, consideration_epoch, retry_ordinal], logical_deadline: next_retry_at, merge_dedup_key: proactive_retry_attempt}
    controlled_injection: {public_seams: [QQC2CHost.tick, QQC2CHost.drain], upstream_material: [real technical failure terminal, logical Clock advance]}
    expected_path: [scheduler discovery, TriggerProcess claim/CAS, same role author, typed proposal, Action/receipt]
    legal_terminals: [accepted, role silent, superseded, technical failure/retry exhausted]
    visible_effect: qq
    observability: [health, causal lineage, ModelResult, usage/cost, latency, ledger refs]
    fault_matrix: [provider timeout/invalid, CAS conflict, restart, lease expiry, late result, withdrawal/permission change, bad-trigger starvation]
    vertical_lanes: [proactive_action]
    closure_mechanisms: [action-budget-receipt-recovery]
    projection_due_fields: [ProactiveTechnicalRetryState.next_retry_at]
    action_kinds: [proactive_message]
    model_contract: {purpose: proactive_contact, contract_identity: character-interior-proactive-contact-decision.1}
    retry_policy: {policy_id: technical-retry-10-30-120.1, seconds: [600, 1800, 7200]}
    activation_note: Technical failure is never represented as character silence.

  - mechanism_id: life.ecology
    purpose: Deterministic event-driven or idle-heartbeat Life Ecology wake orchestration
    release_status: active
    upstream_authority: [accepted World change, persisted ClockAdvanced]
    due_identity: {coordinates: [world_id, actor_ref, source_set, epoch], logical_deadline: next_consideration_at, merge_dedup_key: life_ecology_window}
    controlled_injection: {public_seams: [QQC2CHost.inbound_text, QQC2CHost.inbound_fragment, QQC2CHost.tick, QQC2CHost.drain], upstream_material: [real accepted World source, logical Clock advance]}
    expected_path: [scheduler discovery, TriggerProcess claim/CAS, installed followup dispatch, durable completion]
    legal_terminals: [completed, idle, cooldown, superseded, technical failure/retry]
    visible_effect: none
    observability: [health, causal lineage, followup status, latency, ledger refs]
    fault_matrix: [CAS conflict, restart, lease expiry, followup failure, same-deadline concurrency, bad-trigger starvation]
    vertical_lanes: [life_ecology]
    closure_mechanisms: [life-npc-outcome-continuity]
    projection_due_fields: [LifeEcologyScheduleProjection.next_consideration_at]
    retry_policy: {policy_id: technical-retry-10-30-120.1, seconds: [600, 1800, 7200]}
    activation_note: Active scheduler core only; every model-bearing followup requires its own exact contract row and is not implied by this row.

  - mechanism_id: npc.ecology
    purpose: NPC event or ambient consideration
    release_status: limited
    trigger_mode: event_triggered
    upstream_authority: [accepted NPC-visible World change, sparse ambient Clock]
    due_identity: {coordinates: [world_id, npc_actor_ref, source_set, epoch], logical_deadline: triggering accepted event or unscheduled ambient opportunity, merge_dedup_key: npc_actor_context_window}
    controlled_injection: {public_seams: [QQC2CHost.tick, QQC2CHost.drain], upstream_material: [accepted NPC-visible source, logical Clock advance]}
    expected_path: [scheduler discovery, NPC claim/CAS, NPC Interior decision, typed World proposal, settlement]
    legal_terminals: [accepted, npc no-change, superseded, technical failure/retry]
    visible_effect: conditional
    observability: [health, causal lineage, ModelResult, usage/cost, latency, ledger refs]
    fault_matrix: [provider timeout/invalid, CAS conflict, restart, lease expiry, late result, withdrawal/permission change, bad-trigger starvation]
    vertical_lanes: [npc_ecology]
    closure_mechanisms: [life-npc-outcome-continuity]
    projection_due_fields: []
    activation_note: Limited because no unified durable NPC schedule Projection or declared structured model contract exists.

  - mechanism_id: reflection.life
    purpose: Source-bound private life reflection opportunity
    release_status: limited
    trigger_mode: event_triggered
    upstream_authority: [accepted appraisal or settled experience]
    due_identity: {coordinates: [world_id, actor_ref, source_set, epoch], logical_deadline: immediate accepted appraisal event, merge_dedup_key: reflection_source_window}
    controlled_injection: {public_seams: [QQC2CHost.inbound_text, QQC2CHost.inbound_fragment, QQC2CHost.tick, QQC2CHost.drain], upstream_material: [real accepted appraisal or experience, logical Clock advance]}
    expected_path: [scheduler discovery, TriggerProcess claim/CAS, CharacterInterior reflection, typed transition, terminal]
    legal_terminals: [accepted, role no-change, superseded, technical failure/retry]
    visible_effect: none
    observability: [health, causal lineage, ModelResult, usage/cost, latency, ledger refs]
    fault_matrix: [provider timeout/invalid, CAS conflict, restart, lease expiry, late result, withdrawal/permission change, bad-trigger starvation]
    vertical_lanes: [life_reflection]
    closure_mechanisms: [appraisal-affect-relationship-impression]
    projection_due_fields: []
    activation_note: Limited because the current scheduler opens immediately and owns neither a delayed due field nor a reflection-specific installed role contract.

  - mechanism_id: memory.candidate_consolidation
    purpose: Due MemoryCandidate review and consolidation
    release_status: dormant
    upstream_authority: [MemoryCandidate accepted with review_due_at]
    due_identity: {coordinates: [world_id, actor_ref, candidate_id, revision], logical_deadline: review_due_at, merge_dedup_key: memory_candidate_revision}
    controlled_injection: {public_seams: [], upstream_material: [immutable historical MemoryCandidate only]}
    expected_path: [schema and cold-replay compatibility only]
    legal_terminals: [retain, withdraw, revise, role no-change, superseded, technical failure/retry]
    visible_effect: none
    observability: [health, causal lineage, ModelResult, usage/cost, latency, ledger refs]
    fault_matrix: [provider timeout/invalid, CAS conflict, restart, lease expiry, late result, withdrawal/permission change, bad-trigger starvation]
    vertical_lanes: []
    closure_mechanisms: [source-bound-fact-experience-memory-core]
    projection_due_fields: []
    activation_note: Dormant because review_due_at has no production scheduler consumer or consolidation role contract; withdrawal review is a different mechanism.

  - mechanism_id: action.authorized_due
    purpose: Exact dispatch of an authorized Action when not_before becomes due
    release_status: active
    upstream_authority: [ActionAuthorized]
    due_identity: {coordinates: [world_id, action_id, idempotency_key], logical_deadline: Action.not_before, merge_dedup_key: action_idempotency_key}
    controlled_injection: {public_seams: [QQC2CHost.tick, QQC2CHost.drain, WorldV2PlatformHost.receipt], upstream_material: [real authorized Action, logical Clock advance, formal receipt]}
    expected_path: [scheduler discovery, Action claim/CAS, dispatch, formal receipt, settlement]
    legal_terminals: [delivered, failed, cancelled, expired, unknown]
    visible_effect: conditional
    observability: [health, causal lineage, Action state, budget/usage, dispatch latency, ledger refs]
    fault_matrix: [provider timeout/invalid, CAS conflict, restart, lease expiry, late result, withdrawal/permission change, bad-trigger starvation]
    vertical_lanes: [clock, settlement, recovery]
    closure_mechanisms: [action-budget-receipt-recovery]
    projection_due_fields: [Action.not_before, Action.expires_at, ClaimLease.expires_at]
    action_kinds: [reply, followup, proactive_message, reaction, sticker, typing, media_planning, media_render, media_inspection, media_repair, media_delivery]
    activation_note: Active inventory declaration; a later host scenario must intercept transport and save a real receipt before qualification.

  - mechanism_id: expression.deferred_reply
    purpose: Character-authored later reply Action
    release_status: active
    upstream_authority: [accepted Expression timing later]
    due_identity: {coordinates: [world_id, actor_ref, plan_id, beat_id], logical_deadline: ExpressionPlanManifestBeatRef.not_before, merge_dedup_key: expression_beat_id}
    controlled_injection: {public_seams: [QQC2CHost.inbound_text, QQC2CHost.inbound_fragment, QQC2CHost.tick, QQC2CHost.drain, WorldV2PlatformHost.receipt], upstream_material: [real inbound Observation, logical Clock advance, formal receipt]}
    expected_path: [CharacterInterior decision, typed Expression acceptance, Action claim/CAS, dispatch, receipt]
    legal_terminals: [delivered, failed, cancelled, expired, unknown, superseded]
    visible_effect: qq
    observability: [health, causal lineage, ModelResult, Action state, latency, ledger refs]
    fault_matrix: [provider timeout/invalid, CAS conflict, restart, lease expiry, late result, withdrawal/permission change, bad-trigger starvation]
    vertical_lanes: [expression_episode, clock, settlement]
    closure_mechanisms: [expression-beats-deferred-replies]
    projection_due_fields: [ExpressionPlanManifestBeatRef.not_before, ExpressionPlanManifestBeatRef.expires_at]
    action_kinds: [followup]
    activation_note: Active; timing is an explicit character coordinate, never a technical-failure fallback.

  - mechanism_id: expression.multibeat
    purpose: Ordered later Beats in one accepted ExpressionPlan
    release_status: active
    upstream_authority: [ExpressionPlanAccepted]
    due_identity: {coordinates: [world_id, actor_ref, plan_id, beat_id, beat_index], logical_deadline: ExpressionPlanManifestBeatRef.not_before, merge_dedup_key: expression_plan_beat}
    controlled_injection: {public_seams: [QQC2CHost.inbound_text, QQC2CHost.inbound_fragment, QQC2CHost.tick, QQC2CHost.drain, WorldV2PlatformHost.receipt], upstream_material: [real inbound Observation, logical Clock advance, formal receipt]}
    expected_path: [CharacterInterior decision, ExpressionPlan acceptance, per-Beat Action claim/CAS, dispatch, receipt]
    legal_terminals: [delivered, failed, cancelled, expired, unknown, interrupted, plan completed]
    visible_effect: qq
    observability: [health, causal lineage, ModelResult, Action state, per-Beat latency, ledger refs]
    fault_matrix: [provider timeout/invalid, CAS conflict, restart, lease expiry, late result, withdrawal/permission change, bad-trigger starvation]
