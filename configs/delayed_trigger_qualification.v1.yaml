schema_version: 1
matrix_id: delayed-trigger-qualification.1
qualification_layer: declaration_only

# This file is a static declaration inventory, not a host qualification result,
# schedule, execution catalog, or production release authority. release_status
# records intended inventory posture only; the catalog does not consume it as a
# runtime truth. A later public-host scenario package must qualify execution.
#
# These are static cross-links to committed public-host tests, not host-qualified
# results, runtime routes, release gates, or deployment evidence. Every row
# deliberately excludes real provider, stream, autonomy, OneBot callback, and
# soak coverage; those require distinct evidence before any deployment claim.
