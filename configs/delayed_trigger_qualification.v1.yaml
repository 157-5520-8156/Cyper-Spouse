    vertical_lanes: []
    closure_mechanisms: [situation-context-and-advisory]
    projection_due_fields: []
    activation_note: Dormant because the reducer/event exists but no production scheduler emits ThreadExpired.

  - mechanism_id: conversation.expectation_expiry
    purpose: Expiring advisory view of a ResponseExpectationAuthority
    release_status: limited
